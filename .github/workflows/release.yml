name: Release

# Runs when a tag like v1.0.0 is pushed. Builds the installer and the portable exe, writes SHA-256 sums,
# creates a DRAFT release: nothing is published until you press the button on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Third-party notices
        run: node scripts/notices.cjs
      - name: Build installer and portable exe
        run: npm run dist
        env:
          # Signing is optional: with a certificate in repository secrets the exe files are signed, otherwise they are not.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # SignPath Foundation (free signing for open source): after approval of the application add a step with
      # signpath/github-action-submit-signing-request here; see docs/RELEASE.md.
      - name: Checksums and manifests
        shell: pwsh
        run: |
          cd release
          Get-ChildItem Morphio-Setup-*.exe, Morphio-Portable-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content SHA256SUMS.txt
          }
          cd ..
          $setup = (Get-ChildItem release/Morphio-Setup-*.exe | Select-Object -First 1).FullName
          node scripts/make-manifests.cjs $setup --out release/manifests
      - name: Build provenance (proves the files come from this repository)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/Morphio-Setup-*.exe
            release/Morphio-Portable-*.exe
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/Morphio-Setup-*.exe
            release/Morphio-Portable-*.exe
            release/SHA256SUMS.txt
            release/latest.yml
            THIRD_PARTY_NOTICES.txt
