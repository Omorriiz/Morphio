name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11 may skip install scripts (electron, ffmpeg-static, onnxruntime-node): run npm ci with scripts on
      - run: npm ci
      - name: Types, translations, unit tests
        run: npm run check
      - name: End-to-end tests (real Electron window)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
