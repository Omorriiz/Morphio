appId: app.morphio.desktop
productName: Morphio
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  # ONNX Runtime: оставляем только Windows x64 (без Linux/macOS бинарников)
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  # 7-Zip: нужен только Windows x64
  - '!node_modules/7zip-bin/linux/**'
  - '!node_modules/7zip-bin/mac/**'
  - '!node_modules/7zip-bin/win/arm64/**'
  - '!node_modules/7zip-bin/win/ia32/**'
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/onnxruntime-node/**/*
  # FFmpeg нужно запускать как обычную программу, поэтому он лежит вне архива
  - node_modules/ffmpeg-static/**/*
  # 7-Zip тоже запускается как отдельная программа
  - node_modules/7zip-bin/**/*
  # PDF: отрисовка страниц (нативный холст) и данные шрифтов читаются как обычные файлы
  - node_modules/@napi-rs/**/*
  - node_modules/pdfjs-dist/**/*
  # Распознавание текста: рабочий поток и WASM-ядро запускаются как обычные файлы
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  # рабочий поток Tesseract запускается из папки unpacked и ищет свои зависимости рядом
  - node_modules/bmp-js/**/*
  - node_modules/idb-keyval/**/*
  - node_modules/is-url/**/*
  - node_modules/node-fetch/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/tr46/**/*
  - node_modules/webidl-conversions/**/*
  - node_modules/opencollective-postinstall/**/*
  - node_modules/regenerator-runtime/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/zlibjs/**/*
extraFiles:
  # командная строка: morphio.cmd лежит рядом с Morphio.exe
  - from: morphio.cmd
    to: morphio.cmd
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  license: LICENSE
  artifactName: Morphio-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Morphio
  language: '1049'
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
portable:
  artifactName: Morphio-Portable-${version}.${ext}
# Публикацию делает release.yml; electron-builder только собирает (npm run dist = --publish never).
# Секция нужна автообновлению: из неё приложение узнаёт, где искать релизы.
publish:
  provider: github
  owner: Omorriiz
  repo: Morphio
  releaseType: draft
